name: Check Zenodo automation credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-zenodo-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
    steps:
      - name: Report credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ZENODO_ACCESS_TOKEN:-}" ]; then
            echo "ZENODO_ACCESS_TOKEN_AVAILABLE=yes"
          else
            echo "ZENODO_ACCESS_TOKEN_AVAILABLE=no"
          fi
          if [ -n "${ZENODO_TOKEN:-}" ]; then
            echo "ZENODO_TOKEN_AVAILABLE=yes"
          else
            echo "ZENODO_TOKEN_AVAILABLE=no"
          fi

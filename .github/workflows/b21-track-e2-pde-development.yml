name: B21 Track E2 and PDE flagship development

on:
  push:
    branches: [ncs-evidence-v1-track-e2-pde-theory]
    paths:
      - '.github/workflows/b21-track-e2-pde-development.yml'
      - 'evidence_extension_v1/track_e2/**'
      - 'evidence_extension_v1/pde_flagship/**'
      - 'protocols/evidence_extension_v1/track_e2/**'
      - 'protocols/evidence_extension_v1/pde_flagship/**'
      - 'protocols/evidence_extension_v1/theory/**'
      - 'tests_v2/test_bounded_state_theory_contract.py'

permissions:
  contents: read

concurrency:
  group: b21-track-e2-pde-development-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  theory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==2.4.6 scipy==1.17.1 pandas==3.0.3 pytest
          python -m pip install -e . --no-deps
      - name: Compile new evidence modules
        run: |
          python -m compileall -q evidence_extension_v1/track_e2
          python -m compileall -q evidence_extension_v1/pde_flagship
      - name: Verify immutable BasinGraph source
        run: |
          test "$(git rev-parse HEAD:basingraph_v2/optimizer.py)" = \
            "4433d2b92075dcd858529f7f13342631847def4c"
          python - <<'PY'
          from basingraph_v2.optimizer import BasinGraphOptions, IMPLEMENTATION_VERSION
          assert IMPLEMENTATION_VERSION == '2.0.0-rc1'
          assert BasinGraphOptions().stable_hash() == '031b9c3df716889e48e2db753c73ec960b96a0239173ce791b4ed1ee63ed0f69'
          print('TRACK_E2_PDE_FROZEN_SOURCE_OK')
          PY
      - name: Run bounded-state contract checks
        run: python -m pytest -q tests_v2/test_bounded_state_theory_contract.py

  track-e2-development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==2.4.6 scipy==1.17.1 pandas==3.0.3
          python -m pip install -e . --no-deps
      - name: Execute registered Track E2 development test
        run: |
          python evidence_extension_v1/track_e2/run_development.py \
            --output results_b21/track_e2/development \
            --workers 4 \
            --bootstrap-replicates 10000
      - name: Upload Track E2 development evidence
        uses: actions/upload-artifact@v4
        with:
          name: track-e2-development
          path: results_b21/track_e2/development
          if-no-files-found: error
          retention-days: 90

  pde-flagship-development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==2.4.6 scipy==1.17.1 pandas==3.0.3
          python -m pip install -e . --no-deps
      - name: Execute registered PDE flagship development test
        run: |
          python evidence_extension_v1/pde_flagship/run_development.py \
            --output results_b21/pde_flagship/development \
            --workers 4
      - name: Upload PDE flagship development evidence
        uses: actions/upload-artifact@v4
        with:
          name: pde-flagship-development
          path: results_b21/pde_flagship/development
          if-no-files-found: error
          retention-days: 90

name: Amend Track B source fidelity before confirmatory access

on:
  push:
    branches: [ncs-evidence-v1-track-b]
    paths:
      - '.github/workflows/track-b-amend-fidelity.yml'

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply registered source-alignment corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          import json
          import subprocess

          root = Path('.')
          previous_smoke_commit = '9b30cd7f89552af3488132b091b6d6d5765731ac'
          source_path = root / 'evidence_extension_v1/track_b/modern_baselines.py'
          text = source_path.read_text(encoding='utf-8')

          def replace_once(payload: str, old: str, new: str, label: str) -> str:
              count = payload.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return payload.replace(old, new, 1)

          # Shared helpers: C++-style positive rounding, CR sentinel handling,
          # jSO memory blending, and sequential archive replacement/truncation.
          helper_marker = 'def _repair_midpoint(\n'
          helpers = '''def _round_half_up_positive(value: float) -> int:\n    \"\"\"Match C/C++ round for non-negative algorithmic counts.\"\"\"\n\n    value = float(value)\n    if value < 0:\n        raise ValueError(\"value must be non-negative\")\n    return int(math.floor(value + 0.5))\n\n\ndef _sample_cr_from_memory(\n    rng: np.random.Generator,\n    location: float,\n    scale: float = 0.1,\n) -> float:\n    \"\"\"Sample CR, preserving the negative L-SHADE/jSO sentinel.\"\"\"\n\n    if float(location) < 0.0:\n        return 0.0\n    return float(np.clip(rng.normal(float(location), scale), 0.0, 1.0))\n\n\ndef _success_history_cr(\n    values: np.ndarray,\n    weights: np.ndarray,\n) -> float:\n    \"\"\"Return the weighted Lehmer CR memory or the -1 sentinel.\"\"\"\n\n    values = np.asarray(values, dtype=float)\n    weights = np.asarray(weights, dtype=float)\n    if float(np.sum(weights * values)) <= 0.0:\n        return -1.0\n    return _weighted_lehmer(values, weights)\n\n\ndef _jso_blend_memory(old_value: float, new_value: float) -> float:\n    \"\"\"Apply the jSO half-old, half-new memory update.\"\"\"\n\n    return 0.5 * (float(old_value) + float(new_value))\n\n\n'''
          if '_round_half_up_positive' not in text:
              if helper_marker not in text:
                  raise SystemExit('Shared-helper insertion point not found.')
              text = text.replace(helper_marker, helpers + helper_marker, 1)

          archive_start = text.index('def _archive_insert(\n')
          archive_end = text.index('\n\ndef _initial_population(', archive_start)
          archive_impl = '''def _archive_insert(\n    archive: list[np.ndarray],\n    points: list[np.ndarray],\n    capacity: int,\n    rng: np.random.Generator,\n) -> None:\n    \"\"\"Update the external archive using source-style random replacement.\n\n    New successful parents fill unused slots and then replace uniformly random\n    active slots.  When population reduction lowers capacity, the active prefix\n    is truncated, matching the C/C++ archive-count update.\n    \"\"\"\n\n    capacity = int(capacity)\n    if capacity <= 0:\n        archive.clear()\n        return\n    if len(archive) > capacity:\n        del archive[capacity:]\n    for point in points:\n        candidate = np.asarray(point, dtype=float).copy()\n        if len(archive) < capacity:\n            archive.append(candidate)\n        else:\n            archive[int(rng.integers(capacity))] = candidate\n'''
          text = text[:archive_start] + archive_impl + text[archive_end:]

          text = replace_once(
              text,
              '    return max(4, int(round(25.0 * math.log(dimension) * math.sqrt(dimension))))\n',
              '    return max(4, _round_half_up_positive(25.0 * math.log(dimension) * math.sqrt(dimension)))\n',
              'jSO population integerization',
          )

          l_start = text.index('def optimize_lshade_101(\n')
          j_start = text.index('def optimize_jso(\n')
          s_start = text.index('def optimize_lsrtde(\n')
          prefix = text[:l_start]
          lshade = text[l_start:j_start]
          jso = text[j_start:s_start]
          suffix = text[s_start:]

          # L-SHADE 1.0.1 source alignment.
          lshade = replace_once(
              lshade,
              '    \"\"\"Corrected L-SHADE 1.0.1 paper-faithful Python port.\n',
              '    \"\"\"Corrected L-SHADE 1.0.1 source-aligned Python port.\n',
              'L-SHADE docstring',
          )
          lshade = lshade.replace(
              'paper_faithful_python_port_corrected_1.0.1',
              'source_aligned_python_port_corrected_1.0.1',
          )
          lshade = replace_once(
              lshade,
              '                cr = float(np.clip(rng.normal(memory_cr[memory_slot], 0.1), 0.0, 1.0))\n',
              '                cr = _sample_cr_from_memory(rng, memory_cr[memory_slot])\n',
              'L-SHADE CR sampling',
          )
          lshade = replace_once(
              lshade,
              '                p_count = max(2, int(math.ceil(p_rate * population_size)))\n                pbest = int(order[int(rng.integers(p_count))])\n',
              '                p_count = max(2, _round_half_up_positive(p_rate * population_size))\n                p_count = min(p_count, population_size)\n                pbest = int(order[int(rng.integers(p_count))])\n',
              'L-SHADE p-best count',
          )
          strict_old = '''                if trial_value <= fitness[i]:\n                    next_population[i] = trial\n                    next_fitness[i] = trial_value\n                    replaced_parents.append(population[i].copy())\n                    successful_f.append(f_scale)\n                    successful_cr.append(cr)\n                    improvements.append(max(fitness[i] - trial_value, 0.0))\n'''
          strict_new = '''                if trial_value <= fitness[i]:\n                    next_population[i] = trial\n                    next_fitness[i] = trial_value\n                    if trial_value < fitness[i]:\n                        replaced_parents.append(population[i].copy())\n                        successful_f.append(f_scale)\n                        successful_cr.append(cr)\n                        improvements.append(fitness[i] - trial_value)\n'''
          lshade = replace_once(lshade, strict_old, strict_new, 'L-SHADE strict-success update')
          lshade = replace_once(
              lshade,
              '''                successful_cr_array = np.asarray(successful_cr)\n                if np.max(successful_cr_array) <= 0:\n                    memory_cr[memory_index] = 0.0\n                else:\n                    memory_cr[memory_index] = _weighted_lehmer(\n                        successful_cr_array, weights\n                    )\n''',
              '''                successful_cr_array = np.asarray(successful_cr)\n                memory_cr[memory_index] = _success_history_cr(\n                    successful_cr_array, weights\n                )\n''',
              'L-SHADE CR-memory sentinel',
          )
          lshade = replace_once(
              lshade,
              '''            target_size = int(\n                round(\n                    initial_size\n                    + (minimum_size - initial_size)\n                    * (bo.nfe / bo.max_evals)\n                )\n            )\n''',
              '''            target_size = _round_half_up_positive(\n                initial_size\n                + (minimum_size - initial_size)\n                * (bo.nfe / bo.max_evals)\n            )\n''',
              'L-SHADE population rounding',
          )
          lshade = lshade.replace(
              'int(round(archive_rate * len(population)))',
              '_round_half_up_positive(archive_rate * len(population))',
          )
          lshade = lshade.replace(
              'int(round(archive_rate * target_size))',
              '_round_half_up_positive(archive_rate * target_size)',
          )

          # jSO source alignment.
          jso = replace_once(
              jso,
              '    \"\"\"Paper-faithful jSO Python port with frozen CEC-2017 parameters.\n',
              '    \"\"\"Source-aligned jSO Python port with frozen CEC-2017 parameters.\n',
              'jSO docstring',
          )
          jso = jso.replace(
              'paper_faithful_python_port_CEC2017',
              'source_aligned_python_port_CEC2017',
          )
          jso = replace_once(
              jso,
              '''    memory_f = np.full(memory_size, 0.3, dtype=float)\n    memory_cr = np.full(memory_size, 0.8, dtype=float)\n    memory_f[-1] = 0.9\n    memory_cr[-1] = 0.9\n    memory_index = 0\n    archive: list[np.ndarray] = []\n''',
              '''    memory_f = np.full(memory_size, 0.3, dtype=float)\n    memory_cr = np.full(memory_size, 0.8, dtype=float)\n    memory_index = 0\n    p_rate = p_max\n    archive: list[np.ndarray] = []\n''',
              'jSO memory initialization',
          )
          jso = replace_once(
              jso,
              '            p_rate = p_max + (p_min - p_max) * progress\n',
              '',
              'jSO p-rate generation update removal',
          )
          jso = replace_once(
              jso,
              '''                slot = int(rng.integers(memory_size))\n                f_scale = _sample_cauchy_positive(rng, memory_f[slot])\n                if progress < 0.6:\n                    f_scale = min(f_scale, 0.7)\n                cr = float(np.clip(rng.normal(memory_cr[slot], 0.1), 0.0, 1.0))\n''',
              '''                slot = int(rng.integers(memory_size))\n                if slot == memory_size - 1:\n                    mu_f = 0.9\n                    mu_cr = 0.9\n                else:\n                    mu_f = memory_f[slot]\n                    mu_cr = memory_cr[slot]\n                f_scale = _sample_cauchy_positive(rng, mu_f)\n                if progress < 0.6:\n                    f_scale = min(f_scale, 0.7)\n                cr = _sample_cr_from_memory(rng, mu_cr)\n''',
              'jSO fixed-last-memory sampling',
          )
          jso = replace_once(
              jso,
              '''                p_count = max(2, int(math.ceil(p_rate * population_size)))\n                pbest = int(order[int(rng.integers(p_count))])\n''',
              '''                p_count = max(2, _round_half_up_positive(p_rate * population_size))\n                p_count = min(p_count, population_size)\n                pbest = int(order[int(rng.integers(p_count))])\n                while progress < 0.50 and pbest == i:\n                    pbest = int(order[int(rng.integers(p_count))])\n''',
              'jSO p-best selection',
          )
          jso = replace_once(jso, strict_old, strict_new, 'jSO strict-success update')
          jso = replace_once(
              jso,
              '''                memory_f[memory_index] = _weighted_lehmer(\n                    np.asarray(successful_f), weights\n                )\n                memory_cr[memory_index] = _weighted_lehmer(\n                    np.asarray(successful_cr), weights\n                )\n                memory_index = (memory_index + 1) % (memory_size - 1)\n''',
              '''                old_f = memory_f[memory_index]\n                old_cr = memory_cr[memory_index]\n                new_f = _weighted_lehmer(np.asarray(successful_f), weights)\n                new_cr = _success_history_cr(\n                    np.asarray(successful_cr), weights\n                )\n                memory_f[memory_index] = _jso_blend_memory(old_f, new_f)\n                memory_cr[memory_index] = _jso_blend_memory(old_cr, new_cr)\n                memory_index = (memory_index + 1) % memory_size\n''',
              'jSO historical-memory update',
          )
          jso = replace_once(
              jso,
              '''            target_size = int(\n                round(\n                    initial_size\n                    + (minimum_size - initial_size)\n                    * (bo.nfe / bo.max_evals)\n                )\n            )\n''',
              '''            target_size = _round_half_up_positive(\n                initial_size\n                + (minimum_size - initial_size)\n                * (bo.nfe / bo.max_evals)\n            )\n''',
              'jSO population rounding',
          )
          jso = jso.replace(
              'int(round(archive_rate * len(population)))',
              '_round_half_up_positive(archive_rate * len(population))',
          )
          jso = replace_once(
              jso,
              '''                _archive_insert(\n                    archive,\n                    [],\n                    int(round(archive_rate * target_size)),\n                    rng,\n                )\n''',
              '''                _archive_insert(\n                    archive,\n                    [],\n                    _round_half_up_positive(archive_rate * target_size),\n                    rng,\n                )\n                p_rate = p_max * (1.0 - 0.5 * bo.nfe / bo.max_evals)\n''',
              'jSO archive reduction and p-rate update',
          )
          jso = replace_once(
              jso,
              '            "p_range": [p_min, p_max],\n',
              '            "p_range": [p_min, p_max],\n            "memory_update": "half_old_plus_half_new_weighted_lehmer",\n            "fixed_sampling_slot": 0.9,\n            "early_pbest_excludes_target_until_fraction": 0.50,\n',
              'jSO metadata',
          )

          source_path.write_text(prefix + lshade + jso + suffix, encoding='utf-8')

          # Add exact contract tests for the amended mechanics.
          test_path = root / 'tests_v2/test_track_b_contract.py'
          tests = test_path.read_text(encoding='utf-8')
          old_import = '''from evidence_extension_v1.track_b.modern_baselines import (\n    OPTIMIZERS,\n    _jso_initial_population_size,\n)\n'''
          new_import = '''from evidence_extension_v1.track_b.modern_baselines import (\n    OPTIMIZERS,\n    _archive_insert,\n    _jso_blend_memory,\n    _jso_initial_population_size,\n    _round_half_up_positive,\n    _sample_cr_from_memory,\n    _success_history_cr,\n)\n'''
          tests = replace_once(tests, old_import, new_import, 'Track B test imports')
          marker = '\n\ndef test_track_b_seed_formula() -> None:\n'
          block = '''\n\ndef test_registered_rounding_and_memory_rules() -> None:\n    assert _round_half_up_positive(2.5) == 3\n    rng = np.random.default_rng(19)\n    assert _sample_cr_from_memory(rng, -0.1) == 0.0\n    weights = np.asarray([0.4, 0.6])\n    assert _success_history_cr(np.asarray([0.0, 0.0]), weights) == -1.0\n    assert np.isclose(_jso_blend_memory(0.8, -1.0), -0.1)\n\n\ndef test_registered_archive_random_replacement_and_truncation() -> None:\n    rng = np.random.default_rng(29)\n    archive = [np.asarray([0.0]), np.asarray([1.0])]\n    _archive_insert(archive, [np.asarray([2.0])], 2, rng)\n    assert len(archive) == 2\n    assert any(np.array_equal(point, np.asarray([2.0])) for point in archive)\n    _archive_insert(archive, [], 1, rng)\n    assert len(archive) == 1\n\n'''
          if 'test_registered_rounding_and_memory_rules' not in tests:
              if marker not in tests:
                  raise SystemExit('Track B test insertion marker not found.')
              tests = tests.replace(marker, block + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          protocol_root = root / 'protocols/evidence_extension_v1/track_b'

          # Parameter and provenance records.
          path = protocol_root / 'TRACK_B_PARAMETER_TABLE.csv'
          rows = list(csv.DictReader(path.open(encoding='utf-8')))
          for row in rows:
              if row['algorithm'] == 'L_SHADE_1_0_1' and row['parameter'] == 'memory size':
                  row['note'] = 'archive rate 2.6; p=0.11; CR=-1 sentinel when successful CR denominator is zero'
              if row['algorithm'] == 'jSO' and row['parameter'] == 'memory size':
                  row['note'] = 'archive rate 1.0; p from 0.25 to 0.125; fixed sampling slot 0.9; half-old half-new memory update'
          rows.append({
              'algorithm': 'jSO',
              'parameter': 'early p-best restriction',
              'value': 'p-best cannot equal target before 0.5 MaxFES',
              'secondary_value': '',
              'note': 'registered from public CEC-2017 source',
          })
          with path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)

          path = protocol_root / 'TRACK_B_BASELINE_PROVENANCE.csv'
          rows = list(csv.DictReader(path.open(encoding='utf-8')))
          for row in rows:
              if row['algorithm'] == 'L_SHADE_1_0_1':
                  row['verified_status'] = 'source-aligned transparent port; not byte-identical official executable'
                  row['deviation_from_source'] = 'NumPy RNG and arbitrary finite bounds/objective adapter; corrected random archive replacement retained'
              if row['algorithm'] == 'jSO':
                  row['source_basis'] = 'public CEC-2017 jSO C++ source mirror and Brest et al. paper'
                  row['verified_status'] = 'source-aligned transparent port; not byte-identical official executable'
                  row['deviation_from_source'] = 'NumPy RNG and arbitrary finite bounds/objective adapter'
          with path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)

          path = protocol_root / 'TRACK_B_ALGORITHM_SPECIFICATIONS.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          for item in data['algorithms']:
              if item['id'] == 'L_SHADE_1_0_1':
                  item['implementation'] = 'source-aligned transparent Python port of corrected author release'
                  item['registered_source_rules'] = [
                      'strict-improvement success history',
                      'negative CR-memory sentinel',
                      'C++-style count rounding',
                      'random archive replacement and active-prefix truncation',
                  ]
              if item['id'] == 'jSO':
                  item['implementation'] = 'source-aligned transparent Python port of public CEC-2017 source'
                  item['registered_source_rules'] = [
                      'initial population round(25*ln(D)*sqrt(D))',
                      'fixed 0.9 sampling slot',
                      'half-old half-new memory update',
                      'negative CR-memory sentinel',
                      'early p-best target exclusion',
                      'strict-improvement success history',
                      'random archive replacement and active-prefix truncation',
                  ]
          data['protocol_revision'] = '1.0.2'
          data['amendments'] = ['TRACK_B_AMENDMENT_001', 'TRACK_B_AMENDMENT_002']
          data.pop('amendment', None)
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          path = protocol_root / 'TRACK_B_CONFIRMATORY_PROTOCOL.md'
          protocol = path.read_text(encoding='utf-8')
          amendment1 = 'Amendment 001: jSO initial population corrected to `round(25 ln(D) sqrt(D))`; confirmatory objective evaluations before the amendment: **0**.  \n'
          amendment2 = 'Amendment 002: L-SHADE/jSO success-history, CR-sentinel, archive, rounding and jSO memory/p-best rules aligned with their public source specifications; confirmatory objective evaluations before the amendment: **0**.  \n'
          if amendment2 not in protocol:
              protocol = replace_once(protocol, amendment1, amendment1 + amendment2, 'Protocol amendment line')
          protocol = protocol.replace(
              '- L-SHADE 1.0.1: transparent Python port based on the corrected author release;\n',
              '- L-SHADE 1.0.1: source-aligned transparent Python port based on the corrected author release;\n',
          )
          protocol = protocol.replace(
              '- jSO: transparent Python port of the published CEC-2017 algorithm, with initial population `round(25 ln(D) sqrt(D))`;\n',
              '- jSO: source-aligned transparent Python port of the public CEC-2017 algorithm, including the registered population, memory, p-best and archive rules;\n',
          )
          path.write_text(protocol, encoding='utf-8')

          path = protocol_root / 'TRACK_B_CONFIRMATORY_LOCK.json'
          lock = json.loads(path.read_text(encoding='utf-8'))
          lock['protocol_revision'] = '1.0.2'
          amendments = lock.setdefault('amendments', [])
          amendments.append({
              'id': 'TRACK_B_AMENDMENT_002',
              'date': '2026-08-08',
              'timing': 'after development-only smoke and before confirmatory evaluation',
              'confirmatory_objective_evaluations_before_amendment': 0,
              'changes': [
                  'L-SHADE: strict-improvement success history, CR=-1 sentinel, source-style archive update and C++-style count rounding',
                  'jSO: fixed 0.9 sampling slot, half-old half-new memory update, CR sentinel, early p-best exclusion, strict-improvement success history, source-style archive update and C++-style count rounding',
              ],
              'reason': 'alignment with the corrected L-SHADE release and public jSO CEC-2017 source',
              'effect': 'all earlier Track B smoke gates are superseded; a new development-only smoke is required',
          })
          path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')

          amendment = protocol_root / 'TRACK_B_AMENDMENT_002.md'
          amendment.write_text('''# Track B Amendment 002: source-alignment corrections\n\nStatus: **registered before confirmatory evaluation**  \nDate: 2026-08-08  \nConfirmatory objective evaluations before amendment: **0**\n\n## Trigger\n\nA second, line-by-line provenance audit compared the transparent Python ports\nwith the corrected L-SHADE release and public jSO CEC-2017 C++ source.  The\nreview identified source-level rules that were simplified in the first Track B\nport: strict-success memory admission, the negative CR-memory sentinel,\nsource-style external-archive replacement, C++ count rounding, and the jSO\nfixed sampling slot, half-old/half-new memory update and early p-best target\nrestriction.\n\n## Registered correction\n\nThe L-SHADE and jSO ports now implement those rules explicitly.  The objective\nwrapper, arbitrary finite bounds, NumPy random-number generator, seeds, budget,\nproblem partition, endpoints and all other algorithms remain unchanged.  The\nports remain transparent research ports and are not described as byte-identical\nofficial executables.\n\n## Consequence\n\nThe original local smoke and the Amendment-001 CI smoke remain retained as\ninfrastructure records but are superseded as baseline-fidelity gates.  A new\ndevelopment-only smoke on the Amendment-002 source is mandatory before any\nTrack B confirmatory access.\n''', encoding='utf-8')

          # Refresh source identity after all modified files exist.
          identity_path = protocol_root / 'TRACK_B_SOURCE_IDENTITY.json'
          identity = json.loads(identity_path.read_text(encoding='utf-8'))
          identity['identity_version'] = '1.0.2'
          old_amendment = identity.pop('amendment', None)
          identity['amendments'] = [
              old_amendment or {
                  'id': 'TRACK_B_AMENDMENT_001',
                  'confirmatory_objective_evaluations_before_amendment': 0,
              },
              {
                  'id': 'TRACK_B_AMENDMENT_002',
                  'previous_smoke_commit': previous_smoke_commit,
                  'confirmatory_objective_evaluations_before_amendment': 0,
                  'source_alignment': [
                      'L-SHADE success-history and CR sentinel',
                      'jSO memory, p-best and success-history rules',
                      'source-style archive replacement',
                      'C++-style positive count rounding',
                  ],
                  'smoke_rerun_required': True,
              },
          ]
          identity['implementation_notice']['L_SHADE_1_0_1'] = (
              'Source-aligned transparent Python port of corrected L-SHADE 1.0.1; '
              'not a byte-identical official executable.'
          )
          identity['implementation_notice']['jSO'] = (
              'Source-aligned transparent Python port of public jSO CEC-2017 '
              'source; not a byte-identical official executable.'
          )
          tracked_paths = list(identity['git_blobs'])
          amendment_rel = amendment.as_posix()
          if amendment_rel not in tracked_paths:
              tracked_paths.append(amendment_rel)
          blobs = {}
          for rel in sorted(tracked_paths):
              if not Path(rel).is_file():
                  raise SystemExit(f'Source-identity path missing: {rel}')
              blobs[rel] = subprocess.check_output(
                  ['git', 'hash-object', rel], text=True
              ).strip()
          identity['git_blobs'] = blobs
          identity_path.write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')

          subprocess.run(
              ['python', 'evidence_extension_v1/track_b/generate_protocol_manifest.py'],
              check=True,
          )
          PY

      - name: Run amended contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_b/TRACK_B_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest
          python -m pytest -q tests_v2/test_track_b_contract.py

      - name: Commit pre-confirmatory amendment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_extension_v1/track_b/modern_baselines.py \
                  tests_v2/test_track_b_contract.py \
                  protocols/evidence_extension_v1/track_b
          git commit -m "Align Track B L-SHADE and jSO ports before confirmatory access"
          git push origin HEAD:ncs-evidence-v1-track-b

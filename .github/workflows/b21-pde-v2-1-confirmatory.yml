name: B21 PDE flagship v2.1 confirmatory

on:
  push:
    branches: [ncs-evidence-v1-track-e2-pde-theory]
    paths:
      - '.github/workflows/b21-pde-v2-1-confirmatory.yml'

permissions:
  contents: read

concurrency:
  group: b21-pde-v2-1-confirmatory
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==2.4.6 scipy==1.17.1 pandas==3.0.3
          python -m pip install -e . --no-deps
      - name: Verify pre-access lock and immutable optimizer
        run: |
          test -f protocols/evidence_extension_v1/pde_flagship/PDE_V2_1_CONFIRMATORY_LOCK.json
          test "$(git rev-parse HEAD:basingraph_v2/optimizer.py)" = \
            "4433d2b92075dcd858529f7f13342631847def4c"
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('protocols/evidence_extension_v1/pde_flagship/PDE_V2_1_CONFIRMATORY_LOCK.json').read_text())
          assert lock['status'] == 'PDE_FLAGSHIP_V2_1_LOCKED_BEFORE_CONFIRMATORY_ACCESS'
          assert lock['confirmatory_objective_evaluations_before_lock'] == 0
          print('PDE_V2_1_PREACCESS_LOCK_OK')
          PY
      - name: Execute locked PDE flagship v2.1 confirmation
        run: |
          python evidence_extension_v1/pde_flagship/run_confirmatory_v2_1.py \
            --output results_b21/pde_flagship/confirmatory_v2_1 \
            --workers 4
      - name: Upload PDE flagship v2.1 confirmatory evidence
        uses: actions/upload-artifact@v4
        with:
          name: pde-flagship-confirmatory-v2-1
          path: results_b21/pde_flagship/confirmatory_v2_1
          if-no-files-found: error
          retention-days: 90

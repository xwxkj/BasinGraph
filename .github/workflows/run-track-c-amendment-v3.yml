name: Run B21 Track C pre-confirmatory amendment v3

on:
  push:
    branches: [ncs-evidence-v1-track-c]
    paths:
      - '.github/workflows/run-track-c-amendment-v3.yml'

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct NIST amendment selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts_v2/amend_track_c_preconfirmatory.py')
          text = path.read_text(encoding='utf-8')
          old = '''    replace_once(\n        "evidence_extension_v1/track_c/nist.py",\n        "    start1 = np.asarray(spec.start1, dtype=float)\\n",\n        "    start1 = np.asarray(spec.start1, dtype=float)\\n"\n        "    start2 = np.asarray(spec.start2, dtype=float)\\n",\n    )\n'''
          new = '''    replace_once(\n        "evidence_extension_v1/track_c/nist.py",\n        "    certified = np.asarray(spec.certified, dtype=float)\\n"\n        "    start1 = np.asarray(spec.start1, dtype=float)\\n",\n        "    certified = np.asarray(spec.certified, dtype=float)\\n"\n        "    start1 = np.asarray(spec.start1, dtype=float)\\n"\n        "    start2 = np.asarray(spec.start2, dtype=float)\\n",\n    )\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one NIST selector block, found {count}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('TRACK_C_NIST_AMENDMENT_SELECTOR_FIXED')
          PY

      - name: Install frozen Track C environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_c/TRACK_C_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest

      - name: Apply and validate registered amendment
        shell: bash
        run: |
          set -euo pipefail
          python scripts_v2/amend_track_c_preconfirmatory.py
          python evidence_extension_v1/track_c/materialize_track_c.py
          python -m pytest -q tests_v2/test_track_c_contract.py
          python -m compileall -q \
            evidence_extension_v1/track_c \
            tests_v2/test_track_c_contract.py
          bash -n evidence_extension_v1/track_c/run_track_c_mac.sh
          bash -n START_B21_TRACK_C_SMOKE.command
          bash -n START_B21_TRACK_C_CONFIRMATORY.command

      - name: Validate registered reference hooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_b21/track_c/amendment_smoke
          python evidence_extension_v1/track_c/task_specific_references.py \
            --mode smoke \
            --output \
            results_b21/track_c/amendment_smoke/task_specific_reference_results.csv
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          identity = json.loads(Path(
              'protocols/evidence_extension_v1/track_c/'
              'TRACK_C_SOURCE_IDENTITY.json'
          ).read_text())
          if identity.get('identity_version') != '1.1.0':
              raise SystemExit('Track C identity version was not amended.')
          if identity.get('task_specific_reference_tasks') != 18:
              raise SystemExit('Task-specific reference count is not frozen.')
          refs = pd.read_csv(
              'results_b21/track_c/amendment_smoke/'
              'task_specific_reference_results.csv'
          )
          if len(refs) != 3 or not refs.fbest.map(lambda x: x == x).all():
              raise SystemExit('Task-specific reference smoke failed.')
          print('TRACK_C_ANALYSIS_AMENDMENT_OK')
          print(refs[['task_id', 'method', 'fbest']].to_string(index=False))
          PY

      - name: Regenerate portable manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_b21/track_c/amendment_smoke
          find basingraph_v2 evidence_extension_v1/track_c tests_v2 \
            -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          find basingraph_v2 evidence_extension_v1/track_c tests_v2 \
            -type f -name '*.pyc' -delete
          rm -f scripts_v2/amend_track_c_preconfirmatory.py
          python evidence_extension_v1/track_c/materialize_track_c.py
          python evidence_extension_v1/track_c/generate_protocol_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path
          identity = json.loads(Path(
              'protocols/evidence_extension_v1/track_c/'
              'TRACK_C_SOURCE_IDENTITY.json'
          ).read_text())
          bad = [p for p in identity['git_blobs'] if '__pycache__' in p or p.endswith('.pyc')]
          if bad:
              raise SystemExit(f'Non-portable files remain: {bad}')
          if int(identity.get('confirmatory_objective_evaluations_before_freeze', -1)) != 0:
              raise SystemExit('Confirmatory evaluation count is not zero.')
          print('TRACK_C_AMENDED_SOURCE_IDENTITY_OK')
          print('Identity files:', len(identity['git_blobs']))
          PY

      - name: Commit amended Track C source and protocol
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            evidence_extension_v1/track_c \
            protocols/evidence_extension_v1/track_c \
            tests_v2/test_track_c_contract.py \
            data/nist \
            scripts_v2/amend_track_c_preconfirmatory.py
          git commit -m \
            'Amend Track C checkpoints, primary analysis and descriptive references before evaluation'
          git push origin HEAD:ncs-evidence-v1-track-c

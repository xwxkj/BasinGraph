name: Run B21 Track C pre-confirmatory amendment v2

on:
  push:
    branches: [ncs-evidence-v1-track-c]
    paths:
      - '.github/workflows/run-track-c-amendment-v2.yml'

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install frozen Track C environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_c/TRACK_C_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest

      - name: Apply registered pre-confirmatory amendment
        shell: bash
        run: |
          set -euo pipefail
          python scripts_v2/amend_track_c_preconfirmatory.py
          python evidence_extension_v1/track_c/materialize_track_c.py
          python -m pytest -q tests_v2/test_track_c_contract.py
          python -m compileall -q \
            evidence_extension_v1/track_c \
            tests_v2/test_track_c_contract.py
          bash -n evidence_extension_v1/track_c/run_track_c_mac.sh
          bash -n START_B21_TRACK_C_SMOKE.command
          bash -n START_B21_TRACK_C_CONFIRMATORY.command

      - name: Validate registered descriptive reference hooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_b21/track_c/amendment_smoke
          python evidence_extension_v1/track_c/task_specific_references.py \
            --mode smoke \
            --output \
            results_b21/track_c/amendment_smoke/task_specific_reference_results.csv
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          identity = json.loads(
              Path(
                  'protocols/evidence_extension_v1/track_c/'
                  'TRACK_C_SOURCE_IDENTITY.json'
              ).read_text()
          )
          if identity.get('identity_version') != '1.1.0':
              raise SystemExit('Track C identity version was not amended.')
          if identity.get('task_specific_reference_tasks') != 18:
              raise SystemExit('Task-specific reference count is not frozen.')
          refs = pd.read_csv(
              'results_b21/track_c/amendment_smoke/'
              'task_specific_reference_results.csv'
          )
          if len(refs) != 3:
              raise SystemExit(f'Expected 3 reference rows, got {len(refs)}')
          if not refs.fbest.map(lambda value: value == value).all():
              raise SystemExit('Task-specific smoke references are non-finite.')
          print('TRACK_C_ANALYSIS_AMENDMENT_OK')
          print(refs[['task_id', 'method', 'fbest']].to_string(index=False))
          PY

      - name: Regenerate portable manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_b21/track_c/amendment_smoke
          find basingraph_v2 evidence_extension_v1/track_c tests_v2 \
            -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          find basingraph_v2 evidence_extension_v1/track_c tests_v2 \
            -type f -name '*.pyc' -delete
          rm -f scripts_v2/amend_track_c_preconfirmatory.py
          python evidence_extension_v1/track_c/materialize_track_c.py
          python evidence_extension_v1/track_c/generate_protocol_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path

          identity = json.loads(
              Path(
                  'protocols/evidence_extension_v1/track_c/'
                  'TRACK_C_SOURCE_IDENTITY.json'
              ).read_text()
          )
          bad = [
              path for path in identity['git_blobs']
              if '__pycache__' in path or path.endswith('.pyc')
          ]
          if bad:
              raise SystemExit(f'Non-portable files remain in identity: {bad}')
          if int(identity.get('confirmatory_objective_evaluations_before_freeze', -1)) != 0:
              raise SystemExit('Confirmatory evaluations occurred before amendment.')
          print('TRACK_C_AMENDED_SOURCE_IDENTITY_OK')
          print('Identity files:', len(identity['git_blobs']))
          PY

      - name: Commit amended Track C source and protocol
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            evidence_extension_v1/track_c \
            protocols/evidence_extension_v1/track_c \
            tests_v2/test_track_c_contract.py \
            data/nist \
            scripts_v2/amend_track_c_preconfirmatory.py
          git commit -m \
            'Amend Track C checkpoints, primary analysis and descriptive references before evaluation'
          git push origin HEAD:ncs-evidence-v1-track-c

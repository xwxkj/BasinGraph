name: Materialize B21 Track C frozen payload

# Registered pre-evaluation correction of the elliptic interface assembly.
on:
  push:
    branches: [ncs-evidence-v1-track-c]
    paths:
      - '.github/workflows/track-c-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify and extract frozen payload
        shell: bash
        run: |
          set -euo pipefail
          cat .track_c_bootstrap/part_*.txt > /tmp/track_c_payload.b64
          base64 --decode /tmp/track_c_payload.b64 > /tmp/track_c_payload.tar.xz
          echo '48f8f60207282f6879ba006430ea51524f286acd6df63564179c5be813bd39bb  /tmp/track_c_payload.tar.xz' | sha256sum --check -
          tar -xJf /tmp/track_c_payload.tar.xz -C .
          find evidence_extension_v1/track_c -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          find evidence_extension_v1/track_c -type f -name '*.pyc' -delete
          rm -rf .track_c_bootstrap

          python - <<'PY'
          from pathlib import Path

          tasks = Path('evidence_extension_v1/track_c/tasks.py')
          text = tasks.read_text(encoding='utf-8')
          old = '''        left = np.empty(n)\n        right = np.empty(n)\n        left[0] = k_nodes[0]\n        left[1:] = k_half\n        right[:-1] = k_half\n        right[-1] = k_nodes[-1]\n'''
          new = '''        # k_half contains the n+1 conductivity values at interfaces.\n        left = k_half[:-1]\n        right = k_half[1:]\n'''
          if text.count(old) != 1:
              raise SystemExit(
                  f'Expected one elliptic interface block, found {text.count(old)}.'
              )
          tasks.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests_v2/test_track_c_contract.py')
          test_text = tests.read_text(encoding='utf-8')
          test_block = '''\n\ndef test_elliptic_pde_interface_discretization() -> None:\n    import numpy as np\n    from evidence_extension_v1.track_c.tasks import make_c1_task\n\n    task = make_c1_task("elliptic_pde_inverse", 11)\n    assert task.dimension == 6\n    assert np.isfinite(task.objective(task.reference_x))\n'''
          if 'test_elliptic_pde_interface_discretization' not in test_text:
              tests.write_text(test_text + test_block, encoding='utf-8')

          note = Path(
              'protocols/evidence_extension_v1/track_c/'
              'TRACK_C_IMPLEMENTATION_NOTE_001.md'
          )
          note.write_text(
              '# Track C implementation note 001: elliptic interface assembly\n\n'
              'Status: **registered before any Track C objective evaluation**  \n'
              'Date: 2026-08-08  \n'
              'Track C confirmatory objective evaluations before correction: **0**\n\n'
              'The development preflight identified a shape inconsistency in the '
              'one-dimensional elliptic finite-volume interface assembly. The '
              '`n+1` harmonic-interface sequence is now split into its left and '
              'right `n`-entry views (`k_half[:-1]` and `k_half[1:]`). This is '
              'the standard conservative tridiagonal assembly for `n` interior '
              'unknowns. No development, confirmatory or observed-data result '
              'was produced before this correction. The correction is covered '
              'by a permanent construction test and is part of the frozen Track C '
              'source identity.\n',
              encoding='utf-8',
          )
          PY

      - name: Retrieve frozen NIST StRD ASCII files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/nist
          commit='fe389bbbd1fe936cd73742bd81fc6fce7ac92858'
          base="https://raw.githubusercontent.com/lmfit/lmfit-py/${commit}/NIST_STRD"
          for name in Chwirut1 Roszman1 ENSO Eckerle4 Bennett5 BoxBOD; do
            curl --fail --location --retry 4 --retry-delay 2 \
              "${base}/${name}.dat" \
              --output "data/nist/${name}.dat"
          done

      - name: Install frozen Track C environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_c/TRACK_C_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest

      - name: Materialize protocol locks, provenance and source identity
        shell: bash
        run: |
          set -euo pipefail
          python evidence_extension_v1/track_c/materialize_track_c.py
          python -m compileall -q evidence_extension_v1/track_c tests_v2/test_track_c_contract.py
          bash -n evidence_extension_v1/track_c/run_track_c_mac.sh
          bash -n START_B21_TRACK_C_SMOKE.command
          bash -n START_B21_TRACK_C_CONFIRMATORY.command

      - name: Run frozen Track C contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests_v2/test_track_c_contract.py

      - name: Commit frozen Track C payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .track_c_bootstrap \
                     START_B21_TRACK_C_SMOKE.command \
                     START_B21_TRACK_C_CONFIRMATORY.command \
                     evidence_extension_v1/track_c \
                     protocols/evidence_extension_v1/track_c \
                     tests_v2/test_track_c_contract.py \
                     data/nist
          git commit -m 'Materialize frozen B21 Track C scientific-application runner'
          git push origin HEAD:ncs-evidence-v1-track-c

name: Amend Track B jSO fidelity before confirmatory access

on:
  push:
    branches: [ncs-evidence-v1-track-b]
    paths:
      - '.github/workflows/track-b-amend-jso.yml'

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply registered jSO correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          import json
          import subprocess

          root = Path('.')
          old_smoke_commit = '66a421a5726c017035202c16d5d6e861ad57445f'

          # Correct jSO's initial population before any Track B confirmatory
          # instance (21--30) has been evaluated.
          path = root / 'evidence_extension_v1/track_b/modern_baselines.py'
          text = path.read_text(encoding='utf-8')
          helper_marker = 'def optimize_lshade_101(\n'
          helper = '''def _jso_initial_population_size(dimension: int) -> int:\n    \"\"\"Return the registered jSO initial population size.\n\n    The published jSO specification uses N_init = 25 ln(D) sqrt(D).\n    \"\"\"\n\n    dimension = int(dimension)\n    if dimension < 1:\n        raise ValueError(\"dimension must be positive\")\n    return max(4, int(round(25.0 * math.log(dimension) * math.sqrt(dimension))))\n\n\n'''
          if '_jso_initial_population_size' not in text:
              if helper_marker not in text:
                  raise SystemExit('Could not locate helper insertion point.')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          old = '    initial_size = max(4, 25 * dimension)\n'
          new = (
              '    registered_initial_size = _jso_initial_population_size(dimension)\n'
              '    initial_size = registered_initial_size\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old jSO population line, found {text.count(old)}.')
          text = text.replace(old, new, 1)

          old_meta = '            \"initial_population\": 25 * dimension,\n'
          new_meta = (
              '            \"initial_population\": registered_initial_size,\n'
              '            \"initial_population_formula\": \"round(25*ln(D)*sqrt(D))\",\n'
          )
          if text.count(old_meta) != 1:
              raise SystemExit('Could not locate old jSO metadata line.')
          text = text.replace(old_meta, new_meta, 1)

          old_doc = '    \"\"\"Paper-faithful jSO Python port with frozen CEC-2017 parameters.\"\"\"\n'
          new_doc = (
              '    \"\"\"Paper-faithful jSO Python port with frozen CEC-2017 parameters.\n\n'
              '    The registered initial population is round(25 ln(D) sqrt(D)),\n'
              '    with a minimum population of four.\n'
              '    \"\"\"\n'
          )
          if text.count(old_doc) != 1:
              raise SystemExit('Could not locate jSO docstring.')
          text = text.replace(old_doc, new_doc, 1)
          path.write_text(text, encoding='utf-8')

          # Add a formula-level contract test.
          path = root / 'tests_v2/test_track_b_contract.py'
          text = path.read_text(encoding='utf-8')
          old_import = 'from evidence_extension_v1.track_b.modern_baselines import OPTIMIZERS\n'
          new_import = (
              'from evidence_extension_v1.track_b.modern_baselines import (\n'
              '    OPTIMIZERS,\n'
              '    _jso_initial_population_size,\n'
              ')\n'
          )
          if text.count(old_import) != 1:
              raise SystemExit('Could not locate modern-baseline import.')
          text = text.replace(old_import, new_import, 1)
          insert_marker = '\n\ndef test_track_b_seed_formula() -> None:\n'
          test_block = '''\n\ndef test_jso_registered_initial_population_formula() -> None:\n    assert _jso_initial_population_size(5) == 90\n    assert _jso_initial_population_size(20) == 335\n\n'''
          if 'test_jso_registered_initial_population_formula' not in text:
              if insert_marker not in text:
                  raise SystemExit('Could not locate test insertion point.')
              text = text.replace(insert_marker, test_block + insert_marker, 1)
          path.write_text(text, encoding='utf-8')

          # Update parameter table.
          path = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_PARAMETER_TABLE.csv'
          rows = list(csv.DictReader(path.open(encoding='utf-8')))
          found = False
          for row in rows:
              if row['algorithm'] == 'jSO' and row['parameter'] == 'initial population':
                  row['value'] = 'round(25 ln(D) sqrt(D))'
                  row['note'] = 'minimum 4; D=5 gives 90 and D=20 gives 335'
                  found = True
          if not found:
              raise SystemExit('jSO population row not found in parameter table.')
          with path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)

          # Update algorithm specification.
          path = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_ALGORITHM_SPECIFICATIONS.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          for item in data['algorithms']:
              if item['id'] == 'jSO':
                  item['registered_initial_population'] = 'round(25*ln(D)*sqrt(D))'
                  item['registered_values'] = {'D5': 90, 'D20': 335}
                  break
          else:
              raise SystemExit('jSO missing from algorithm specifications.')
          data['protocol_revision'] = '1.0.1'
          data['amendment'] = 'TRACK_B_AMENDMENT_001'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          # Update provenance table while retaining the port limitation.
          path = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_BASELINE_PROVENANCE.csv'
          rows = list(csv.DictReader(path.open(encoding='utf-8')))
          for row in rows:
              if row['algorithm'] == 'jSO':
                  row['deviation_from_source'] = (
                      'objective and arbitrary-bounds adapter; registered initial '
                      'population round(25 ln(D) sqrt(D))'
                  )
          with path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)

          # Amend protocol and lock before confirmatory access.
          path = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_CONFIRMATORY_PROTOCOL.md'
          text = path.read_text(encoding='utf-8')
          old_status = 'Status: **frozen before confirmatory evaluation**  \n'
          new_status = (
              'Status: **frozen and amended before confirmatory evaluation**  \n'
              'Amendment 001: jSO initial population corrected to '
              '`round(25 ln(D) sqrt(D))`; confirmatory objective evaluations before '
              'the amendment: **0**.  \n'
          )
          if text.count(old_status) != 1:
              raise SystemExit('Could not locate protocol status line.')
          text = text.replace(old_status, new_status, 1)
          old_line = '- jSO: transparent Python port of the published CEC-2017 algorithm;\n'
          new_line = (
              '- jSO: transparent Python port of the published CEC-2017 algorithm, '
              'with initial population `round(25 ln(D) sqrt(D))`;\n'
          )
          if text.count(old_line) != 1:
              raise SystemExit('Could not locate jSO protocol line.')
          path.write_text(text.replace(old_line, new_line, 1), encoding='utf-8')

          path = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_CONFIRMATORY_LOCK.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          data['protocol_revision'] = '1.0.1'
          data['amendments'] = [{
              'id': 'TRACK_B_AMENDMENT_001',
              'date': '2026-08-08',
              'timing': 'after development-only smoke and before confirmatory evaluation',
              'confirmatory_objective_evaluations_before_amendment': 0,
              'change': 'jSO initial population: 25D -> round(25*ln(D)*sqrt(D))',
              'reason': 'alignment with the published jSO CEC-2017 specification',
              'effect': 'v1 smoke is engineering-only and superseded; rerun smoke required',
          }]
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          # Human-readable amendment record.
          amendment = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_AMENDMENT_001.md'
          amendment.write_text('''# Track B Amendment 001: jSO initial population\n\nStatus: **registered before confirmatory evaluation**  \nDate: 2026-08-08  \nConfirmatory objective evaluations before amendment: **0**\n\n## Trigger\n\nA post-smoke provenance review found that the frozen v1 Python port used an\ninitial jSO population of `25D`. The published jSO specification states\n\n```text\nN_init = 25 ln(D) sqrt(D)\n```\n\nThe v1 smoke used development instance 1 only and did not access Track B\ninstances 21--30.\n\n## Registered correction\n\nThe Track B jSO port now uses\n\n```text\nN_init = max(4, round(25 ln(D) sqrt(D)))\n```\n\nwhich gives 90 individuals in 5D and 335 in 20D. No other algorithm, seed,\nbudget, instance, comparator or endpoint setting is changed.\n\n## Consequence\n\nThe v1 smoke remains an infrastructure record but is superseded for baseline\nfidelity. A new development-only smoke is required before confirmatory access.\nAll v1 records are retained and excluded from confirmatory statistics.\n''', encoding='utf-8')

          # Refresh source identity. Identity and manifest are excluded from
          # their own recursive identities.
          identity_path = root / 'protocols/evidence_extension_v1/track_b/TRACK_B_SOURCE_IDENTITY.json'
          identity = json.loads(identity_path.read_text(encoding='utf-8'))
          identity['identity_version'] = '1.0.1'
          identity['amendment'] = {
              'id': 'TRACK_B_AMENDMENT_001',
              'previous_smoke_commit': old_smoke_commit,
              'confirmatory_objective_evaluations_before_amendment': 0,
              'jso_initial_population': 'round(25*ln(D)*sqrt(D))',
              'smoke_rerun_required': True,
          }
          identity['implementation_notice']['jSO'] = (
              'Frozen Python port of the published jSO specification with '
              'initial population round(25*ln(D)*sqrt(D)); not a byte-identical '
              'official executable.'
          )
          paths = list(identity['git_blobs'])
          amendment_rel = amendment.as_posix()
          if amendment_rel not in paths:
              paths.append(amendment_rel)
          blobs = {}
          for rel in sorted(paths):
              if not Path(rel).is_file():
                  raise SystemExit(f'Identity path missing: {rel}')
              blobs[rel] = subprocess.check_output(
                  ['git', 'hash-object', rel], text=True
              ).strip()
          identity['git_blobs'] = blobs
          identity_path.write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')

          subprocess.run(
              ['python', 'evidence_extension_v1/track_b/generate_protocol_manifest.py'],
              check=True,
          )
          PY

      - name: Run amended contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_b/TRACK_B_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest
          python -m pytest -q tests_v2/test_track_b_contract.py

      - name: Commit pre-confirmatory amendment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence_extension_v1/track_b/modern_baselines.py \
                  tests_v2/test_track_b_contract.py \
                  protocols/evidence_extension_v1/track_b
          git commit -m "Amend Track B jSO population before confirmatory access"
          git push origin HEAD:ncs-evidence-v1-track-b

name: Clean B21 Track C source identity before evaluation

on:
  push:
    branches: [ncs-evidence-v1-track-c]
    paths:
      - '.github/workflows/track-c-clean-identity.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install frozen Track C environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_c/TRACK_C_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest

      - name: Exclude generated bytecode and revise source identity
        shell: bash
        run: |
          set -euo pipefail
          find basingraph_v2 evidence_extension_v1/track_c \
            -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          find basingraph_v2 evidence_extension_v1/track_c \
            -type f -name '*.pyc' -delete

          python - <<'PY'
          from pathlib import Path

          path = Path('evidence_extension_v1/track_c/materialize_track_c.py')
          text = path.read_text(encoding='utf-8')
          old = '''            if path.is_file() and path.name not in {"TRACK_C_SOURCE_IDENTITY.json", "MANIFEST_SHA256.csv"}:\n                paths.append(path)\n'''
          new = '''            if (\n                path.is_file()\n                and "__pycache__" not in path.parts\n                and path.suffix != ".pyc"\n                and path.name not in {"TRACK_C_SOURCE_IDENTITY.json", "MANIFEST_SHA256.csv"}\n            ):\n                paths.append(path)\n'''
          if text.count(old) != 1:
              raise SystemExit(
                  f'Expected one source-path filter, found {text.count(old)}.'
              )
          text = text.replace(old, new, 1)
          text = text.replace(
              '"identity_version": "1.0.0",',
              '"identity_version": "1.0.1",',
              1,
          )
          marker = '        "date": retrieved,\n'
          addition = (
              '        "date": retrieved,\n'
              '        "identity_revision": "exclude generated Python bytecode from portable source identity",\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Could not locate source-identity date field.')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')

          note = Path(
              'protocols/evidence_extension_v1/track_c/'
              'TRACK_C_IMPLEMENTATION_NOTE_002.md'
          )
          note.write_text(
              '# Track C implementation note 002: portable source identity\n\n'
              'Status: **registered before any Track C objective evaluation**  \n'
              'Date: 2026-08-08  \n'
              'Track C confirmatory objective evaluations before correction: **0**\n\n'
              'The first materialized identity inadvertently listed interpreter-'
              'generated `__pycache__` and `.pyc` files. These files are not source '
              'artifacts and are Python-version and platform dependent. They have '
              'been removed from the repository and permanently excluded from the '
              'Track C source-identity traversal. No algorithm, task, parameter, '
              'dataset, reference value, budget or endpoint changed.\n',
              encoding='utf-8',
          )
          PY

      - name: Regenerate frozen identity and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          python evidence_extension_v1/track_c/materialize_track_c.py
          python -m pytest -q tests_v2/test_track_c_contract.py
          python -m compileall -q evidence_extension_v1/track_c tests_v2/test_track_c_contract.py
          find basingraph_v2 evidence_extension_v1/track_c tests_v2 \
            -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          find basingraph_v2 evidence_extension_v1/track_c tests_v2 \
            -type f -name '*.pyc' -delete
          python evidence_extension_v1/track_c/generate_protocol_manifest.py

          python - <<'PY'
          import json
          from pathlib import Path
          identity = json.loads(Path(
              'protocols/evidence_extension_v1/track_c/TRACK_C_SOURCE_IDENTITY.json'
          ).read_text())
          bad = [p for p in identity['git_blobs'] if '__pycache__' in p or p.endswith('.pyc')]
          if bad:
              raise SystemExit(f'Non-portable files remain in identity: {bad}')
          if identity.get('identity_version') != '1.0.1':
              raise SystemExit('Track C identity version was not revised.')
          print('TRACK_C_PORTABLE_SOURCE_IDENTITY_OK')
          print('Source files:', len(identity['git_blobs']))
          PY

      - name: Commit portable Track C source identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A basingraph_v2 \
                     evidence_extension_v1/track_c \
                     protocols/evidence_extension_v1/track_c \
                     tests_v2 \
                     data/nist
          git commit -m 'Make Track C source identity portable before evaluation'
          git push origin HEAD:ncs-evidence-v1-track-c

name: Freeze Track E2-C alignment lock

on:
  push:
    branches: [ncs-evidence-v1-track-e2-pde-theory]
    paths:
      - '.github/workflows/b21-freeze-track-e2c-lock.yml'

permissions:
  actions: read
  contents: write

jobs:
  freeze-alignment-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==2.4.6 scipy==1.17.1 pandas==3.0.3
          python -m pip install -e . --no-deps
      - name: Download audited Track E2 development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/track-e2-development
          mkdir -p /tmp/track-e2-development
          gh run download 31441743630 \
            --repo xwxkj/BasinGraph \
            --name track-e2-development \
            --dir /tmp/track-e2-development
      - name: Generate locked permutation-control ensemble
        run: |
          python evidence_extension_v1/track_e2/freeze_alignment_lock.py \
            --development-dir /tmp/track-e2-development \
            --e2b-lock protocols/evidence_extension_v1/track_e2/TRACK_E2B_CONFIRMATORY_LOCK.json \
            --output protocols/evidence_extension_v1/track_e2/TRACK_E2C_ALIGNMENT_LOCK.json
      - name: Commit pre-access Track E2-C lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocols/evidence_extension_v1/track_e2/TRACK_E2C_ALIGNMENT_LOCK.json
          git commit -m "Freeze Track E2-C permutation controls before access"
          git push origin HEAD:ncs-evidence-v1-track-e2-pde-theory

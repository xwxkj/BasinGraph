name: Publish BasinGraph v3.1.0 GitHub release

on:
  push:
    branches: [release-v3.1.0-finalization]
    paths:
      - '.github/workflows/publish-v3.1.0-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 2084438e679f61660de497f5464fbe5636373163
      RELEASE_TAG: v3.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or verify immutable v3.1.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            ACTUAL="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${ACTUAL}" != "${RELEASE_COMMIT}" ]; then
              echo "Existing ${RELEASE_TAG} points to ${ACTUAL}, expected ${RELEASE_COMMIT}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" \
              -m "BasinGraph v3.1.0: integrated finite-budget evidence release"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create or update the v3.1.0 release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v3.1.0-release-notes.md <<'EOF'
          # BasinGraph v3.1.0

          This is an evidence-integration, documentation and archive release.
          The result-bearing optimizer remains the immutable BasinGraph
          `2.0.0-rc1` candidate at commit
          `adbc0ecdf1153044188f0508321c47001ad9bdb0`, with frozen options hash
          `031b9c3df716889e48e2db753c73ec960b96a0239173ce791b4ed1ee63ed0f69`.

          ## Public archives

          - Software: https://doi.org/10.5281/zenodo.21857175
          - Integrated evidence dataset: https://doi.org/10.5281/zenodo.20791231
          - Release-source commit: `2084438e679f61660de497f5464fbe5636373163`

          ## Integrated evidence

          - original prospective COCO/BBOB and CUTEst holdouts;
          - Track A: 1,920-run mechanism ablation;
          - Track B: 3,840-run modern-baseline comparison;
          - Track D: 1,440-run 40-320-dimensional `bbob-largescale` comparison;
          - Track D: 60 sequential optimizer-overhead runs;
          - Track C: 2,310 scientific-model and NIST observed-data runs;
          - Track C: 18 separately reported task-specific reference runs;
          - Source Data, Supplementary Information, figures, protocols,
            validation reports, source identities and SHA-256 manifests.

          The evidence supports a bounded finite-budget competitiveness claim.
          It does not support a claim that BasinGraph is the best overall
          optimizer or that every mechanism improves aggregate performance.
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "BasinGraph v3.1.0" \
              --notes-file /tmp/v3.1.0-release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "BasinGraph v3.1.0" \
              --notes-file /tmp/v3.1.0-release-notes.md
          fi

      - name: Correct the historical v3.0.0 release note
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.0.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            cat > /tmp/v3.0.0-release-notes.md <<'EOF'
          # BasinGraph v3.0.0

          This was a documentation and archive-composition release. The
          result-bearing optimizer remained BasinGraph `2.0.0-rc1`; no optimizer
          source, frozen option, benchmark run, raw result, statistical analysis
          or numerical conclusion was changed.

          ## DOI correction

          The reserved or unverified value `10.5281/zenodo.20800093` shown in
          the original preparation note is not an authoritative citation.

          Use these public records:

          - original software v2.0.0: https://doi.org/10.5281/zenodo.20789002
          - original dataset v2.0.0: https://doi.org/10.5281/zenodo.20788903
          - current software v3.1.0: https://doi.org/10.5281/zenodo.21857175
          - current integrated dataset v3.1.0: https://doi.org/10.5281/zenodo.20791231
          EOF
            gh release edit v3.0.0 \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file /tmp/v3.0.0-release-notes.md
          fi

      - name: Verify release identities
        shell: bash
        run: |
          set -euo pipefail
          TAG_TARGET="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "${TAG_TARGET}" = "${RELEASE_COMMIT}"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,isDraft,isPrerelease,url,targetCommitish

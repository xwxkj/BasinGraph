name: Materialize B21 Track D frozen payload

on:
  push:
    branches: [ncs-evidence-v1-track-d]
    paths:
      - '.github/workflows/track-d-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify and extract frozen payload
        shell: bash
        run: |
          set -euo pipefail
          cat .track_d_bootstrap/part_*.txt > /tmp/track_d_payload.b64
          base64 --decode /tmp/track_d_payload.b64 > /tmp/track_d_payload.tar.xz
          echo '9dc6faaf4f7eb7957d1edee36102333a1286f927c561659f292bf3e577030994  /tmp/track_d_payload.tar.xz' | sha256sum --check -
          tar -xJf /tmp/track_d_payload.tar.xz -C .
          rm -rf .track_d_bootstrap
          # GitHub App tokens cannot create workflow files. The validated CI
          # workflow is added through the connected user action after this
          # payload commit succeeds.
          rm -f .github/workflows/b21-track-d-ci.yml

      - name: Validate materialized payload
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q evidence_extension_v1/track_d tests_v2/test_track_d_contract.py
          bash -n evidence_extension_v1/track_d/run_track_d_mac.sh
          bash -n START_B21_TRACK_D_SMOKE.command
          bash -n START_B21_TRACK_D_CONFIRMATORY.command
          python evidence_extension_v1/track_d/generate_protocol_manifest.py
          git diff --exit-code -- protocols/evidence_extension_v1/track_d/MANIFEST_SHA256.csv

      - name: Commit frozen Track D payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add START_B21_TRACK_D_SMOKE.command \
                  START_B21_TRACK_D_CONFIRMATORY.command \
                  evidence_extension_v1/track_d \
                  protocols/evidence_extension_v1/track_d \
                  tests_v2/test_track_d_contract.py \
                  .track_d_bootstrap
          git commit -m 'Materialize frozen B21 Track D scalability runner'
          git push origin HEAD:ncs-evidence-v1-track-d

name: B21 Track B preflight and smoke

on:
  pull_request:
    paths:
      - 'basingraph_v2/**'
      - 'evidence_extension_v1/track_b/**'
      - 'protocols/evidence_extension_v1/track_b/**'
      - 'tests_v2/test_track_b_contract.py'
      - '.github/workflows/b21-track-b-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  track-b-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      B21_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install frozen Track B environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r protocols/evidence_extension_v1/track_b/TRACK_B_REQUIREMENTS_LOCK.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Compile sources
        run: python -m compileall -q basingraph basingraph_v2 evidence_extension_v1/track_b
      - name: Run frozen contract tests
        run: python -m pytest -q tests_v2
      - name: Generate protocol and repository manifests
        run: |
          python evidence_extension_v1/track_b/generate_protocol_manifest.py
          python scripts_v2/generate_repository_manifest.py
      - name: Step 0 identity audit
        run: |
          python scripts_v2/audit_step0_identity.py --require-manifest --output results_b21/track_b/ci_identity.json
      - name: Track B zero-evaluation preflight
        run: python evidence_extension_v1/track_b/preflight_track_b.py --mode smoke --output results_b21/track_b/ci_preflight.json
      - name: Track B smoke shards and official cocopp
        run: |
          python evidence_extension_v1/track_b/run_track_b_all.py --mode smoke --workers 2 --run-id ci_track_b_smoke
          python evidence_extension_v1/track_b/finalize_track_b.py --mode smoke --run-id ci_track_b_smoke
      - name: Upload Track B smoke
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-b-${{ runner.os }}
          path: |
            protocols/evidence_extension_v1/track_b/MANIFEST_SHA256.csv
            results_b21/track_b/ci_identity.json
            results_b21/track_b/ci_preflight.json
            results_b21/track_b/ci_track_b_smoke
          if-no-files-found: warn
